name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rozpakuj projekt
        run: |
          ls -la
          for z in *.zip; do unzip -o "$z"; done
          P=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -1)
          echo "Projekt: $P"
          echo "PROJ=$(dirname "$P")" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Teleport-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
